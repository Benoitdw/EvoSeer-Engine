[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoseer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipywidgets>=8.1.8",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[tool.setuptools.packages.find]
include = ["evoseer*", "calibration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipynb>=0.5.1",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "networkx>=3.0",
    "notebook>=7.5.5",
    "pytest>=9.0.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]
